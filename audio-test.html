<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAREN VERSE · Diagnóstico de audio</title><style>body{font-family:system-ui;background:#080d1d;color:#eef3ff;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(620px,90vw)}button{font:700 1.1rem system-ui;padding:18px;border:0;border-radius:12px;background:#3271db;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#18243d;padding:20px;border-radius:12px;line-height:1.7}p{line-height:1.6}</style></head><body><main><h1>GAREN VERSE · Diagnóstico Web Audio</h1><p>Pulsa PROBAR AUDIO en Safari. Deberías escuchar dos tonos. Esta prueba es independiente de la web.</p><button id="test">PROBAR AUDIO</button><pre id="status" role="status" aria-live="polite">Esperando pulsación…</pre></main><script>
(()=>{'use strict';const btn=document.getElementById('test'),out=document.getElementById('status');let ctx;const log=x=>out.textContent+='\n'+x;btn.addEventListener('click',async()=>{btn.disabled=true;out.textContent='Prueba iniciada por pulsación.';try{const AC=window.AudioContext||window.webkitAudioContext;log('AudioContext disponible: '+!!AC);if(!AC)return;ctx ||= new AC();log('Estado inicial: '+ctx.state);log('Sample rate: '+ctx.sampleRate);const pending=ctx.state==='running'?Promise.resolve():ctx.resume();const start=ctx.currentTime+0.1;for(let i=0;i<2;i++){const t=start+i*.38,osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=i?660:440;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.17,t+.03);gain.gain.exponentialRampToValueAtTime(.0001,t+.28);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.3)}await Promise.race([pending,new Promise((_,rej)=>setTimeout(()=>rej(new Error('resume() no respondió en 3 segundos')),3000))]);log('Estado tras resume(): '+ctx.state);await new Promise(r=>setTimeout(r,900));log('Estado final: '+ctx.state);log('¿Has escuchado dos tonos? Indícalo al responder.')}catch(e){log('ERROR: '+e.name+': '+e.message)}finally{btn.disabled=false}})})();
</script></body></html>
